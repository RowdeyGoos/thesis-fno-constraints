name: constraints-pretrain-bc-soft
entity: rowdey_goos-tu-delft
project: neuraloperators
program: scripts/entrypoints/train.py
method: bayes
metric:
  name: best_val_err
  goal: minimize
run_cap: 12
parameters:
  # Train mixed BC foundation model with strict-FM proxy budget.
  max_epochs:
    value: 150
  checkpoint_selection_metric:
    value: val_err
  plot_figs:
    value: !!bool False
  save_checkpoint:
    value: !!bool True
  log_to_wandb:
    value: !!bool True

  # BC setup.
  use_bc_channels:
    value: !!bool True
  constraint_bc_enforcement:
    value: soft
  constraint_bc_weight:
    distribution: log_uniform_values
    min: 0.001
    max: 0.5
  constraint_bc_warmup_fraction:
    values: [0.0, 0.05, 0.1]
  constraint_bc_loss_norm:
    values: ['l2', 'l1']
  constraint_bc_eps:
    value: 1.0e-8

  # Keep other constraints off to isolate BC soft tuning.
  constraint_zero_mode_enable:
    value: !!bool False
  constraint_zero_mode_enforcement:
    value: off
  constraint_zero_mode_weight:
    value: 0.0

  constraint_pde_enable:
    value: !!bool False
  constraint_pde_method:
    value: penalty
  constraint_pde_weight:
    value: 0.0
  constraint_pde_warmup_fraction:
    value: 0.0
  constraint_pde_relative_norm:
    value: !!bool True
