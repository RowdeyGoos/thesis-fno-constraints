default: &DEFAULT
  # Use single-process loading for local smoke tests, especially on Windows where
  # h5py dataset handles are not pickleable with multiprocessing DataLoader workers.
  num_data_workers: 0
  # model
  model: 'fno'
  depth: 5
  in_dim: 2
  out_dim: 1
  dropout: 0
  # data/domain
  Lx: !!float 1.0
  Ly: !!float 1.0
  nx: 64
  ny: 64
  # optimization
  loss_style: 'mean'
  loss_func: 'mse'
  checkpoint_selection_metric: 'val_loss'  # options: val_loss, val_err
  optimizer: 'adam'
  scheduler: 'none'
  lr: !!float 1.0
  max_epochs: 5
  max_cosine_lr_epochs: 5
  batch_size: 4
  # misc
  log_to_screen: !!bool True
  save_checkpoint: !!bool True
  seed: 0
  plot_figs: !!bool False
  pack_data: !!bool False
  # Weights & Biases
  entity: 'local'
  project: 'neuraloperators-local-smoke'
  log_to_wandb: !!bool False
  distill: !!bool False
  subsample: 1
  # constraint defaults
  constraint_zero_mode_enable: !!bool False
  constraint_zero_mode_enforcement: 'off'  # off | hard | soft
  constraint_zero_mode_weight: 0.0
  constraint_zero_mode_warmup_fraction: 0.0
  constraint_zero_mode_mode: 'gauge_aware'
  constraint_zero_mode_omega_tol: 1.0e-8
  constraint_pde_enable: !!bool False
  constraint_pde_weight: 0.0
  constraint_pde_warmup_fraction: 0.1
  constraint_pde_eps: 1.0e-8
  constraint_pde_relative_norm: !!bool True
  constraint_pde_method: 'penalty'  # options: penalty, augmented_lagrangian
  constraint_pde_al_rho: 1.0
  constraint_pde_al_lambda0: 0.0
  constraint_pde_al_dual_clip: 1.0e6
  constraint_diffusion_tensor_order: 'k11_k22_k12'

poisson-local-smoke-base: &poisson_local_smoke_base
  <<: *DEFAULT
  system: 'poisson'
  model: 'fno'
  layers: [16, 16, 16, 16, 16]
  modes1: [9, 9, 9, 9]
  modes2: [9, 9, 9, 9]
  fc_dim: 32
  in_dim: 4
  out_dim: 1
  mode_cut: 8
  embed_cut: 16
  fc_cut: 2
  optimizer: 'adam'
  lr: 5.0e-4
  max_epochs: 3
  batch_size: 8
  valid_batch_size: 8
  train_path:  'data/local_smoke_poisson/_train_k1_5_32k.h5'
  val_path:    'data/local_smoke_poisson/_val_k1_5_4k.h5'
  test_path:   'data/local_smoke_poisson/_test_k1_5_4k.h5'
  scales_path: 'data/local_smoke_poisson/local_smoke_scales.npy'

poisson-local-smoke-constraints:
  <<: *poisson_local_smoke_base
  constraint_zero_mode_enable: !!bool True
  constraint_zero_mode_enforcement: 'hard'
  constraint_zero_mode_mode: 'gauge_aware'
  constraint_pde_enable: !!bool True
  constraint_pde_weight: 0.1
  constraint_pde_warmup_fraction: 0.0
  constraint_pde_method: 'augmented_lagrangian'
  constraint_pde_al_rho: 1.0
  constraint_pde_al_lambda0: 0.0

poisson-local-smoke-constraints-soft-zero:
  <<: *poisson_local_smoke_base
  constraint_zero_mode_enable: !!bool False
  constraint_zero_mode_enforcement: 'soft'
  constraint_zero_mode_weight: 0.1
  constraint_zero_mode_warmup_fraction: 0.0
  constraint_zero_mode_mode: 'gauge_aware'
  constraint_pde_enable: !!bool True
  constraint_pde_weight: 0.1
  constraint_pde_warmup_fraction: 0.0
  constraint_pde_method: 'augmented_lagrangian'
  constraint_pde_al_rho: 1.0
  constraint_pde_al_lambda0: 0.0
