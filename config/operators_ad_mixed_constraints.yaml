default: &DEFAULT
  num_data_workers: 2
  # model
  model: 'fno'
  depth: 5
  in_dim: 2
  out_dim: 1
  dropout: 0
  # data/domain
  Lx: !!float 1.0
  Ly: !!float 1.0
  nx: 256
  ny: 256
  # optimization
  loss_style: 'mean'
  loss_func: 'mse'
  checkpoint_selection_metric: 'val_loss'  # options: val_loss, val_err
  optimizer: 'adam'
  scheduler: 'none'
  lr: !!float 1.0
  max_epochs: 500
  max_cosine_lr_epochs: 500
  batch_size: 25
  # misc
  log_to_screen: !!bool True
  save_checkpoint: !!bool False
  seed: 0
  plot_figs: !!bool False
  pack_data: !!bool False
  # Weights & Biases
  entity: 'rowdey_goos-tu-delft'
  project: 'neuraloperators'
  log_to_wandb: !!bool False
  distill: !!bool False
  subsample: 1
  # constraint defaults (all off for baseline comparability)
  constraint_zero_mode_enable: !!bool False
  constraint_zero_mode_enforcement: 'off'  # off | hard | soft
  constraint_zero_mode_weight: 0.0
  constraint_zero_mode_warmup_fraction: 0.0
  constraint_zero_mode_mode: 'gauge_aware'
  constraint_zero_mode_omega_tol: 1.0e-8
  constraint_pde_enable: !!bool False
  constraint_pde_weight: 0.0
  constraint_pde_warmup_fraction: 0.1
  constraint_pde_eps: 1.0e-8
  constraint_pde_relative_norm: !!bool True
  constraint_pde_method: 'penalty'  # options: penalty, augmented_lagrangian
  constraint_pde_al_rho: 1.0
  constraint_pde_al_lambda0: 0.0
  constraint_pde_al_dual_clip: 1.0e6
  constraint_diffusion_tensor_order: 'k11_k22_k12'

advdiff: &advdiff
  <<: *DEFAULT
  batch_size: 128
  valid_batch_size: 128
  nx: 128
  ny: 128
  log_to_wandb: !!bool True
  save_checkpoint: !!bool True
  max_epochs: 50
  scheduler: 'cosine'
  plot_figs: !!bool True
  loss_style: 'sum'
  model: 'fno'
  layers: [64, 64, 64, 64, 64]
  modes1: [65, 65, 65, 65]
  modes2: [65, 65, 65, 65]
  fc_dim: 128
  in_dim: 6
  out_dim: 1
  mode_cut: 16
  embed_cut: 64
  fc_cut: 2
  optimizer: 'adam'
  lr: 1E-3
  pack_data: !!bool False

ad-adr0p2_0p4-mixed-base: &ad_adr0p2_0p4_mixed_base
  <<: *advdiff
  train_path:    'data/advection-diffusion/_train_adr0.2_0.4_32k_mixed.h5'
  val_path:      'data/advection-diffusion/_val_adr0.2_0.4_4k_mixed.h5'
  test_path:     'data/advection-diffusion/_test_adr0.2_0.4_4k_mixed.h5'
  scales_path:   'data/advection-diffusion/_train_adr0.2_0.4_32k_mixed_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500
  plot_figs: !!bool False
  system: 'advection-diffusion'
  in_dim: 7  # AdvDiff with mixed format: 1 (source) + 6 (tensor) = 7 input channels
  constraint_diffusion_tensor_order: 'k11_k12_k22'
  checkpoint_interval_epochs: 50
  checkpoint_best_at_end: !!bool True

# Mixed zero-hard checkpoints were pretrained with hard projection in the forward
# map, so we keep the same projection active during downstream transfer.
ad-adr0p2_0p4-mixed-zero-hard-pretrained-base: &ad_adr0p2_0p4_mixed_zero_hard_pretrained_base
  <<: *ad_adr0p2_0p4_mixed_base
  scales_path:   'data/mixed/_train_mixed_32k_scales.npy'
  constraint_zero_mode_enable: !!bool True
  constraint_zero_mode_enforcement: 'hard'
  constraint_zero_mode_mode: 'gauge_aware'
  constraint_zero_mode_omega_tol: 1.0e-8

# Mixed zero-soft checkpoints keep the standard downstream forward map.
ad-adr0p2_0p4-mixed-zero-soft-pretrained-base: &ad_adr0p2_0p4_mixed_zero_soft_pretrained_base
  <<: *ad_adr0p2_0p4_mixed_base
  scales_path:   'data/mixed/_train_mixed_32k_scales.npy'

# Mixed PDE-penalty checkpoints keep the standard downstream forward map.
ad-adr0p2_0p4-mixed-penalty-pde-pretrained-base: &ad_adr0p2_0p4_mixed_penalty_pde_pretrained_base
  <<: *ad_adr0p2_0p4_mixed_base
  scales_path:   'data/mixed/_train_mixed_32k_scales.npy'

