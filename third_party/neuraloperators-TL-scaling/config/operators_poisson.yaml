default: &DEFAULT
  num_data_workers: 4
  # model
  model: 'fno'
  depth: 5
  in_dim: 2
  out_dim: 1
  dropout: 0
  # data/domain
  Lx: !!float 1.0
  Ly: !!float 1.0
  nx: 256
  ny: 256
  # optimization
  loss_style: 'mean'
  loss_func: 'mse'
  checkpoint_selection_metric: 'val_loss'  # options: val_loss, val_err
  optimizer: 'adam'
  scheduler: 'none'
  lr: !!float 1.0
  max_epochs: 500
  max_cosine_lr_epochs: 500
  batch_size: 25
  # misc
  log_to_screen: !!bool True
  save_checkpoint: !!bool False
  seed: 0
  plot_figs: !!bool False
  pack_data: !!bool False
  # Weights & Biases
  entity: 'rowdey_goos-tu-delft'
  project: 'neuraloperators'
  log_to_wandb: !!bool False
  distill: !!bool False
  subsample: 1
  # constraint defaults (all off for baseline comparability)
  constraint_zero_mode_enable: !!bool False
  constraint_zero_mode_enforcement: 'off'  # off | hard | soft
  constraint_zero_mode_weight: 0.0
  constraint_zero_mode_warmup_fraction: 0.0
  constraint_zero_mode_mode: 'gauge_aware'
  constraint_zero_mode_omega_tol: 1.0e-8
  constraint_pde_enable: !!bool False
  constraint_pde_weight: 0.0
  constraint_pde_warmup_fraction: 0.1
  constraint_pde_eps: 1.0e-8
  constraint_pde_relative_norm: !!bool True
  constraint_pde_method: 'penalty'  # options: penalty, augmented_lagrangian
  constraint_pde_al_rho: 1.0
  constraint_pde_al_lambda0: 0.0
  constraint_pde_al_dual_clip: 1.0e6
  constraint_diffusion_tensor_order: 'k11_k22_k12'

poisson: &poisson
  <<: *DEFAULT
  batch_size: 512
  valid_batch_size: 512
  nx: 128
  ny: 128
  log_to_wandb: !!bool True
  save_checkpoint: !!bool True
  max_epochs: 500
  scheduler: 'cosine'
  plot_figs: !!bool True
  loss_style: 'sum'
  system: 'poisson'

  model: 'fno'
  layers: [64, 64, 64, 64, 64]
  modes1: [65, 65, 65, 65]
  modes2: [65, 65, 65, 65]
  fc_dim: 128

  in_dim: 4
  out_dim: 1
  mode_cut: 16
  embed_cut: 64
  fc_cut: 2

  optimizer: 'adam'

  lr: 1E-3
  pack_data: !!bool False

poisson-scale-k1_5: &poisson_scale_k1_5
  <<: *poisson
  train_path:    'data/poisson/_train_k1_5_32k.h5'
  val_path:      'data/poisson/_val_k1_5_4k.h5'
  test_path:     'data/poisson/_test_k1_5_4k.h5'
  scales_path:   'data/poisson/train_k1_5_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500

# Runtime smoke config for SLURM validation on the real Poisson dataset.
# Keeps dataset/scales identical to poisson-scale-k1_5 and reduces runtime
# via aggressive subsampling and a short training schedule.
poisson-smoke-k1_5-constraints:
  <<: *poisson_scale_k1_5
  log_to_wandb: !!bool False
  plot_figs: !!bool False
  save_checkpoint: !!bool True
  scheduler: 'none'
  max_epochs: 2
  batch_size: 8
  valid_batch_size: 8
  subsample: 4096
  constraint_zero_mode_enable: !!bool True
  constraint_zero_mode_enforcement: 'hard'
  constraint_zero_mode_mode: 'gauge_aware'
  constraint_zero_mode_omega_tol: 1.0e-8
  constraint_pde_enable: !!bool True
  constraint_pde_method: 'augmented_lagrangian'
  constraint_pde_weight: 0.1
  constraint_pde_warmup_fraction: 0.0
  constraint_pde_al_rho: 1.0
  constraint_pde_al_lambda0: 0.0
  constraint_pde_al_dual_clip: 1.0e6

# ========================================
# Transfer Learning: Poisson k∈[5,10]
# ========================================

# Base config for k5_10 domain
poisson-k5_10-base: &poisson_k5_10_base
  <<: *poisson
  train_path:    'data/poisson/_train_k5_10_32k.h5'
  val_path:      'data/poisson/_val_k5_10_4k.h5'
  test_path:     'data/poisson/_test_k5_10_4k.h5'
  scales_path:   'data/poisson/_train_k5_10_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500

# Transfer configs initialized from k1_5 pretraining should keep the source
# normalization scales so the pretrained model sees the same input normalization
# during fine-tuning and evaluation.
poisson-k5_10-pretrained-base: &poisson_k5_10_pretrained_base
  <<: *poisson_k5_10_base
  scales_path:   'data/poisson/train_k1_5_scales.npy'

# Fine-tuning configs (with pre-trained weights from k1_5)
poisson-k5_10-finetune-16: &poisson_k5_10_ft_16
  <<: *poisson_k5_10_pretrained_base
  weights: 'experiments/expts/poisson-scale-k1_5/pretrain-poisson-k1_5-12100803-0/checkpoints/ckpt_best.tar'
  subsample: 2048  # 32768 / 2048 = 16 samples
  batch_size: 16
  valid_batch_size: 128
  max_epochs: 500

poisson-k5_10-finetune-64: &poisson_k5_10_ft_64
  <<: *poisson_k5_10_pretrained_base
  weights: 'experiments/expts/poisson-scale-k1_5/pretrain-poisson-k1_5-12100803-0/checkpoints/ckpt_best.tar'
  subsample: 512   # 32768 / 512 = 64 samples
  batch_size: 32
  valid_batch_size: 128
  max_epochs: 500

poisson-k5_10-finetune-256: &poisson_k5_10_ft_256
  <<: *poisson_k5_10_pretrained_base
  weights: 'experiments/expts/poisson-scale-k1_5/pretrain-poisson-k1_5-12100803-0/checkpoints/ckpt_best.tar'
  subsample: 128   # 32768 / 128 = 256 samples
  batch_size: 64
  valid_batch_size: 128
  max_epochs: 500

poisson-k5_10-finetune-1k: &poisson_k5_10_ft_1k
  <<: *poisson_k5_10_pretrained_base
  weights: 'experiments/expts/poisson-scale-k1_5/pretrain-poisson-k1_5-12100803-0/checkpoints/ckpt_best.tar'
  subsample: 32    # 32768 / 32 = 1024 samples
  batch_size: 128
  valid_batch_size: 128
  max_epochs: 500

poisson-k5_10-finetune-4k: &poisson_k5_10_ft_4k
  <<: *poisson_k5_10_pretrained_base
  weights: 'experiments/expts/poisson-scale-k1_5/pretrain-poisson-k1_5-12100803-0/checkpoints/ckpt_best.tar'
  subsample: 8     # 32768 / 8 = 4096 samples
  batch_size: 128
  valid_batch_size: 128
  max_epochs: 500

# From-scratch training configs (no pre-trained weights)
poisson-k5_10-scratch-zeroshot:
  <<: *poisson_k5_10_base
  batch_size: 128
  valid_batch_size: 128
  max_epochs: 500

poisson-k5_10-scratch-16: &poisson_k5_10_scratch_16
  <<: *poisson_k5_10_base
  subsample: 2048  # 32768 / 2048 = 16 samples
  batch_size: 16
  valid_batch_size: 128
