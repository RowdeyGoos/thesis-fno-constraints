# ========================================
# Transfer Learning: Poisson k∈[1,2.5]
# ========================================

# Base config for k1_2.5 domain (SYS-1 downstream task)
poisson-k1_2.5-base: &poisson_k1_2p5_base
  <<: *poisson
  train_path:    'data/poisson/_train_k1.0_2.5_32k.h5'
  val_path:      'data/poisson/_val_k1.0_2.5_4k.h5'
  test_path:     'data/poisson/_test_k1.0_2.5_4k.h5'
  scales_path:   'data/poisson/_train_k1.0_2.5_32k_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500
  plot_figs: !!bool True

# Base config for k1_2.5 with mixed format (6-component tensors)
poisson-k1_2.5-mixed-base: &poisson_k1_2p5_mixed_base
  <<: *poisson
  train_path:    'data/poisson/_train_k1.0_2.5_32k_mixed.h5'
  val_path:      'data/poisson/_val_k1.0_2.5_4k_mixed.h5'
  test_path:     'data/poisson/_test_k1.0_2.5_4k_mixed.h5'
  scales_path:   'data/poisson/_train_k1.0_2.5_32k_mixed_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500
  plot_figs: !!bool True
  in_dim: 7  # Poisson with mixed format: 1 (source) + 6 (tensor) = 7 input channels
  constraint_diffusion_tensor_order: 'k11_k12_k22'

# Pretrained transfer configs use source-domain scales (single-domain pretrain).
poisson-k1_2.5-pretrained-base: &poisson_k1_2p5_pretrained_base
  <<: *poisson_k1_2p5_base
  scales_path:   'data/poisson/train_k1_5_scales.npy'

# Pretrained transfer configs use mixed pretraining scales (mixed-domain pretrain).
poisson-k1_2.5-mixed-pretrained-base: &poisson_k1_2p5_mixed_pretrained_base
  <<: *poisson_k1_2p5_mixed_base
  scales_path:   'data/mixed/_train_mixed_32k_scales.npy'

# Zero-shot evaluation config (no downstream training)
poisson-k1_2.5-zeroshot:
  <<: *poisson_k1_2p5_pretrained_base
  weights: 'experiments/expts/poisson-scale-k1_5/pretrain-poisson-k1_5-12147812-0/checkpoints/ckpt_best.tar'
  batch_size: 128
  valid_batch_size: 128

poisson-k1_2.5-zeroshot-mixed:
