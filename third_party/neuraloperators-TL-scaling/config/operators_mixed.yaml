# ==============================================================================
# NOTES
# ==============================================================================
# 
# Mixed Dataset Structure:
# - The mixed dataset combines three PDE systems with zero-padding
# - Tensor layout: [k11, k12, k22, vx, vy, omega]
#   * Poisson:    [k11, k12, k22,  0,  0,     0]
#   * AdvDiff:    [k11, k12, k22, vx, vy,     0]
#   * Helmholtz:  [k,   0,   k,   0,  0, omega]
# - When loaded, PDESolns expands tensor to spatial channels: 1 + 6 = 7 channels
#
# Fine-tuning Strategy:
# - The mixed-pretrained model has 7 input channels
# - When fine-tuning on Poisson (normally 4 channels), we keep in_dim: 7
# - The extra channels will receive zero-padded values for Poisson data
# - This maintains compatibility with the pretrained weights
#
# Workflow:
# 1. Create mixed datasets:
#    python utils/create_mixed_dataset.py --poisson_path ... --advdiff_path ... --helmholtz_path ...
# 2. Pretrain on mixed dataset:
#    sbatch scripts/slurm/pretrain/submit_pretrain_mixed.sh
# 3. Update checkpoint paths:
#    bash scripts/utils/update_mixed_checkpoint_path.sh <job_id>
# 4. Fine-tune on downstream tasks (Poisson k∈[1,2.5] SYS-1):
#    sbatch scripts/slurm/finetune/poisson/submit_finetune_poisson_k1_2p5_mixed_array.sh
# 5. Evaluate and compare:
#    python eval_transfer_learning.py --include_mixed
#
