default: &DEFAULT
  num_data_workers: 6
  # model
  model: 'fno'
  depth: 5
  in_dim: 2
  out_dim: 1
  dropout: 0
  # data/domain
  Lx: !!float 1.0
  Ly: !!float 1.0
  nx: 256
  ny: 256
  # optimization
  loss_style: 'mean'
  loss_func: 'mse'
  optimizer: 'adam'
  scheduler: 'none'
  lr: !!float 1.0
  max_epochs: 500
  max_cosine_lr_epochs: 500
  batch_size: 25
  # misc
  log_to_screen: !!bool True
  save_checkpoint: !!bool False
  seed: 0
  plot_figs: !!bool False
  pack_data: !!bool False
  # Weights & Biases
  entity: 'rowdey_goos-tu-delft'
  project: 'neuraloperators'
  log_to_wandb: !!bool False
  distill: !!bool False
  subsample: 1

# ==============================================================================
# MIXED DATASET PRETRAINING CONFIGS
# ==============================================================================
# These configs are for multi-task learning experiments (Figure 6a in paper)
# Training on combined Poisson + Advection-Diffusion + Helmholtz datasets

# Base config for mixed dataset experiments
mixed-pretrain-base: &mixed_pretrain_base
  <<: *DEFAULT
  batch_size: 128
  valid_batch_size: 128
  nx: 128
  ny: 128
  log_to_wandb: !!bool True
  save_checkpoint: !!bool True
  max_epochs: 500
  scheduler: 'cosine'
  plot_figs: !!bool True
  loss_style: 'sum'
  system: 'mixed'
  
  model: 'fno'
  layers: [64, 64, 64, 64, 64]
  modes1: [65, 65, 65, 65]
  modes2: [65, 65, 65, 65]
  fc_dim: 128
  
  in_dim: 7  # 1 (source) + 6 (tensor expanded) = 7 input channels
  out_dim: 1
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  
  optimizer: 'adam'
  lr: 1E-3
  pack_data: !!bool False

# Mixed dataset pretraining (combines Poisson k∈[1,5] + AdvDiff αdr∈[0.2,1] + Helmholtz ω∈[1,10])
mixed-scale-all: &mixed_scale_all
  <<: *mixed_pretrain_base
  train_path:    'data/mixed/_train_mixed_32k.h5'
  val_path:      'data/mixed/_val_mixed_4k.h5'
  test_path:     'data/mixed/_test_mixed_4k.h5'
  scales_path:   'data/mixed/_train_mixed_32k_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500

# ==============================================================================
# DOWNSTREAM TASK BASE CONFIGS
# ==============================================================================
# These are base configs for downstream tasks (used for fine-tuning)

# Poisson k∈[1,2.5] downstream base config (SYS-1 in paper)
poisson-k1_2.5-base: &poisson_k1_2p5_base
  <<: *DEFAULT
  batch_size: 512
  valid_batch_size: 512
  nx: 128
  ny: 128
  log_to_wandb: !!bool True
  save_checkpoint: !!bool True
  max_epochs: 500
  scheduler: 'cosine'
  plot_figs: !!bool True
  loss_style: 'sum'
  system: 'poisson'
  
  model: 'fno'
  layers: [64, 64, 64, 64, 64]
  modes1: [65, 65, 65, 65]
  modes2: [65, 65, 65, 65]
  fc_dim: 128
  
  in_dim: 7
  out_dim: 1
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  
  optimizer: 'adam'
  lr: 1E-3
  pack_data: !!bool False
  
  train_path:    'data/poisson/_train_k1.0_2.5_32k_mixed.h5'
  val_path:      'data/poisson/_val_k1.0_2.5_4k_mixed.h5'
  test_path:     'data/poisson/_test_k1.0_2.5_4k_mixed.h5'
  scales_path:   'data/poisson/_train_k1.0_2.5_32k_mixed_scales.npy'

# ==============================================================================
# TRANSFER LEARNING FROM MIXED PRETRAINING
# ==============================================================================
# Fine-tuning mixed-pretrained model on Poisson k∈[1,2.5] (SYS-1) with varying data sizes

poisson-k1_2.5-zeroshot-mixed:
  <<: *poisson_k1_2p5_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-12173564-0/checkpoints/ckpt_best.tar'
  batch_size: 128
  valid_batch_size: 128

poisson-k1_2.5-finetune-mixed-16:
  <<: *poisson_k1_2p5_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-12173564-0/checkpoints/ckpt_best.tar'
  subsample: 2048  # 32768 / 2048 = 16 samples
  batch_size: 16
  valid_batch_size: 128

poisson-k1_2.5-finetune-mixed-64:
  <<: *poisson_k1_2p5_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-12173564-0/checkpoints/ckpt_best.tar'
  subsample: 512   # 32768 / 512 = 64 samples
  batch_size: 32
  valid_batch_size: 128

poisson-k1_2.5-finetune-mixed-256:
  <<: *poisson_k1_2p5_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-12173564-0/checkpoints/ckpt_best.tar'
  subsample: 128   # 32768 / 128 = 256 samples
  batch_size: 64
  valid_batch_size: 128

poisson-k1_2.5-finetune-mixed-1k:
  <<: *poisson_k1_2p5_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-12173564-0/checkpoints/ckpt_best.tar'
  subsample: 32    # 32768 / 32 = 1024 samples
  batch_size: 128
  valid_batch_size: 128

poisson-k1_2.5-finetune-mixed-4k:
  <<: *poisson_k1_2p5_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-12173564-0/checkpoints/ckpt_best.tar'
  subsample: 8     # 32768 / 8 = 4096 samples
  batch_size: 128
  valid_batch_size: 128

poisson-k1_2.5-finetune-mixed-8k:
  <<: *poisson_k1_2p5_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-12173564-0/checkpoints/ckpt_best.tar'
  subsample: 4     # 32768 / 4 = 8192 samples
  batch_size: 128
  valid_batch_size: 128

poisson-k1_2.5-finetune-mixed-16k:
  <<: *poisson_k1_2p5_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-12173564-0/checkpoints/ckpt_best.tar'
  subsample: 2     # 32768 / 2 = 16384 samples
  batch_size: 128
  valid_batch_size: 128

poisson-k1_2.5-finetune-mixed-32k:
  <<: *poisson_k1_2p5_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-12173564-0/checkpoints/ckpt_best.tar'
  subsample: 1     # 32768 / 1 = 32768 samples (full dataset)
  batch_size: 128
  valid_batch_size: 128

# ==============================================================================
# NOTES
# ==============================================================================
# 
# Mixed Dataset Structure:
# - The mixed dataset combines three PDE systems with zero-padding
# - Tensor layout: [coef0, coef1, coef2, coef3, coef4]
#   * Poisson:    [k11, k12, k22,  0,  0]
#   * AdvDiff:    [k11, k12, k22, vx, vy]
#   * Helmholtz:  [k,  omega,  0,  0,  0]
# - When loaded, PDESolns expands tensor to spatial channels: 1 + 5 = 6 channels
#
# Fine-tuning Strategy:
# - The mixed-pretrained model has 6 input channels
# - When fine-tuning on Poisson (normally 4 channels), we keep in_dim: 6
# - The extra channels will receive zero-padded values for Poisson data
# - This maintains compatibility with the pretrained weights
#
# Workflow:
# 1. Create mixed datasets:
#    python utils/create_mixed_dataset.py --poisson_path ... --advdiff_path ... --helmholtz_path ...
# 2. Pretrain on mixed dataset:
#    sbatch scripts/slurm/pretrain/submit_pretrain_mixed.sh
# 3. Update checkpoint paths:
#    bash scripts/utils/update_mixed_checkpoint_path.sh <job_id>
# 4. Fine-tune on downstream tasks (Poisson k∈[1,2.5] SYS-1):
#    sbatch scripts/slurm/finetune/poisson/submit_finetune_poisson_k1_2p5_mixed_array.sh
# 5. Evaluate and compare:
#    python eval_transfer_learning.py --include_mixed
#
