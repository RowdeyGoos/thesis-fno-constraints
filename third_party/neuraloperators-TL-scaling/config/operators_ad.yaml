default: &DEFAULT
  num_data_workers: 6
  # model
  model: 'fno'
  depth: 5
  in_dim: 2
  out_dim: 1
  dropout: 0
  # data/domain
  Lx: !!float 1.0
  Ly: !!float 1.0
  nx: 256
  ny: 256
  # optimization
  loss_style: 'mean'
  loss_func: 'mse'
  optimizer: 'adam'
  scheduler: 'none'
  lr: !!float 1.0
  max_epochs: 500
  max_cosine_lr_epochs: 500
  batch_size: 25
  # misc
  log_to_screen: !!bool True
  save_checkpoint: !!bool False
  seed: 0
  plot_figs: !!bool False
  pack_data: !!bool False
  # Weights & Biases
  entity: 'rowdey_goos-tu-delft'
  project: 'neuraloperators'
  log_to_wandb: !!bool False
  distill: !!bool False
  subsample: 1

advdiff: &advdiff
  <<: *DEFAULT
  batch_size: 128
  valid_batch_size: 128
  nx: 128
  ny: 128
  log_to_wandb: !!bool True
  save_checkpoint: !!bool True
  max_epochs: 50
  scheduler: 'cosine'
  plot_figs: !!bool True
  loss_style: 'sum'

  model: 'fno'
  layers: [64, 64, 64, 64, 64]
  modes1: [65, 65, 65, 65]
  modes2: [65, 65, 65, 65]
  fc_dim: 128

  in_dim: 6
  out_dim: 1
  mode_cut: 16
  embed_cut: 64
  fc_cut: 2

  optimizer: 'adam'

  lr: 1E-3
  pack_data: !!bool False

ad-scale-adr0p2_1: &ad_scale_0p2_1
  <<: *advdiff
  train_path:    'data/advection-diffusion/_train_adr0.2_1_32k.h5'
  val_path:      'data/advection-diffusion/_val_adr0.2_1_4k.h5'
  test_path:     'data/advection-diffusion/_test_adr0.2_1_4k.h5'
  scales_path:   'data/advection-diffusion/_train_adr0.2_1_32k_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500

# ========================================
# Transfer Learning: AdvDiff adr∈[0.2,0.4]
# ========================================

# Base config for adr0.2_0.4 domain (downstream task)
ad-adr0p2_0p4-base: &ad_adr0p2_0p4_base
  <<: *advdiff
  train_path:    'data/advection-diffusion/_train_adr0.2_0.4_32k.h5'
  val_path:      'data/advection-diffusion/_val_adr0.2_0.4_4k.h5'
  test_path:     'data/advection-diffusion/_test_adr0.2_0.4_4k.h5'
  scales_path:   'data/advection-diffusion/_train_adr0.2_0.4_32k_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500
  system: 'advection-diffusion'

# Base config for adr0.2_0.4 with mixed format (6-component tensors)
ad-adr0p2_0p4-mixed-base: &ad_adr0p2_0p4_mixed_base
  <<: *advdiff
  train_path:    'data/advection-diffusion/_train_adr0.2_0.4_32k_mixed.h5'
  val_path:      'data/advection-diffusion/_val_adr0.2_0.4_4k_mixed.h5'
  test_path:     'data/advection-diffusion/_test_adr0.2_0.4_4k_mixed.h5'
  scales_path:   'data/advection-diffusion/_train_adr0.2_0.4_32k_mixed_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500
  system: 'advection-diffusion'
  in_dim: 7  # AdvDiff with mixed format: 1 (source) + 6 (tensor) = 7 input channels

