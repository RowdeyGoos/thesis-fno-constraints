default: &DEFAULT
  num_data_workers: 6
  # model
  model: 'fno'
  depth: 5
  in_dim: 2
  out_dim: 1
  dropout: 0
  # data/domain
  Lx: !!float 1.0
  Ly: !!float 1.0
  nx: 256
  ny: 256
  # optimization
  loss_style: 'mean'
  loss_func: 'mse'
  optimizer: 'adam'
  scheduler: 'none'
  lr: !!float 1.0
  max_epochs: 500
  max_cosine_lr_epochs: 500
  batch_size: 25
  # misc
  log_to_screen: !!bool True
  save_checkpoint: !!bool False
  seed: 0
  plot_figs: !!bool False
  pack_data: !!bool False
  # Weights & Biases
  entity: 'rowdey_goos-tu-delft'
  project: 'neuraloperators'
  log_to_wandb: !!bool False
  distill: !!bool False
  subsample: 1

helmholtz: &helmholtz
  <<: *DEFAULT
  batch_size: 128
  valid_batch_size: 128
  nx: 128
  ny: 128
  log_to_wandb: !!bool True
  save_checkpoint: !!bool True
  max_epochs: 50
  scheduler: 'cosine'
  plot_figs: !!bool True
  loss_style: 'sum'

  model: 'fno'
  layers: [64, 64, 64, 64, 64]
  modes1: [65, 65, 65, 65]
  modes2: [65, 65, 65, 65]
  fc_dim: 128

  in_dim: 2
  out_dim: 1
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2

  optimizer: 'adam'

  lr: 1E-3
  pack_data: !!bool False

helm-scale-o1_10: &helm_o1_10
  <<: *helmholtz
  train_path:    'data/helmholtz/_train_o1_10_32k.h5'
  val_path:      'data/helmholtz/_val_o1_10_4k.h5'
  test_path:     'data/helmholtz/_test_o1_10_4k.h5'
  scales_path:   'data/helmholtz/_train_o1_10_32k_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  in_dim: 3
  out_dim: 1
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  lr: 1E-3
  subsample: 1

# ========================================
# Transfer Learning: Helmholtz o∈[1,5]
# ========================================

# Base config for o1_5 domain (downstream task)
helm-o1_5-base: &helm_o1_5_base
  <<: *helmholtz
  train_path:    'data/helmholtz/_train_o1_5_32k.h5'
  val_path:      'data/helmholtz/_val_o1_5_4k.h5'
  test_path:     'data/helmholtz/_test_o1_5_4k.h5'
  scales_path:   'data/helmholtz/_train_o1_5_32k_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500
  system: 'helmholtz'
  in_dim: 3
  out_dim: 1

# Base config for o1_5 with mixed format (6-component tensors)
helm-o1_5-mixed-base: &helm_o1_5_mixed_base
  <<: *helmholtz
  train_path:    'data/helmholtz/_train_o1_5_32k_mixed.h5'
  val_path:      'data/helmholtz/_val_o1_5_4k_mixed.h5'
  test_path:     'data/helmholtz/_test_o1_5_4k_mixed.h5'
  scales_path:   'data/helmholtz/_train_o1_5_32k_mixed_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500
  system: 'helmholtz'
  in_dim: 7  # Helmholtz with mixed format: 1 (source) + 6 (tensor) = 7 input channels
  out_dim: 1

# Zero-shot evaluation configs (no downstream training)
helm-o1_5-zeroshot:
  <<: *helm_o1_5_base
  weights: 'experiments/expts/helm-scale-o1_10/pretrain-helmholtz-o1_10-JOBID-2/checkpoints/ckpt_best.tar'
  batch_size: 128
  valid_batch_size: 128

helm-o1_5-zeroshot-mixed:
  <<: *helm_o1_5_mixed_base
  weights: 'experiments/expts/mixed-scale-all/pretrain-mixed-JOBID-0/checkpoints/ckpt_best.tar'
  batch_size: 128
  valid_batch_size: 128

