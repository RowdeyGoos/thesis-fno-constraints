default: &DEFAULT
  num_data_workers: 2
  # model
  model: 'fno'
  depth: 5
  in_dim: 2
  out_dim: 1
  dropout: 0
  # data/domain
  Lx: !!float 1.0
  Ly: !!float 1.0
  nx: 256
  ny: 256
  # optimization
  loss_style: 'mean'
  loss_func: 'mse'
  checkpoint_selection_metric: 'val_loss'  # options: val_loss, val_err
  optimizer: 'adam'
  scheduler: 'none'
  lr: !!float 1.0
  max_epochs: 500
  max_cosine_lr_epochs: 500
  batch_size: 25
  # misc
  log_to_screen: !!bool True
  save_checkpoint: !!bool False
  seed: 0
  plot_figs: !!bool False
  pack_data: !!bool False
  # Weights & Biases
  entity: 'rowdey_goos-tu-delft'
  project: 'neuraloperators'
  log_to_wandb: !!bool False
  distill: !!bool False
  subsample: 1
  # constraint defaults (all off for baseline comparability)
  constraint_zero_mode_enable: !!bool False
  constraint_zero_mode_enforcement: 'off'  # off | hard | soft
  constraint_zero_mode_weight: 0.0
  constraint_zero_mode_warmup_fraction: 0.0
  constraint_zero_mode_mode: 'gauge_aware'
  constraint_zero_mode_omega_tol: 1.0e-8
  constraint_pde_enable: !!bool False
  constraint_pde_weight: 0.0
  constraint_pde_warmup_fraction: 0.1
  constraint_pde_eps: 1.0e-8
  constraint_pde_relative_norm: !!bool True
  constraint_pde_method: 'penalty'  # options: penalty, augmented_lagrangian
  constraint_pde_discretization: 'spectral'
  constraint_pde_al_rho: 1.0
  constraint_pde_al_lambda0: 0.0
  constraint_pde_al_dual_clip: 1.0e6
  constraint_diffusion_tensor_order: 'k11_k22_k12'
  # BC defaults
  use_bc_channels: !!bool True
  bc_value_channel_idx: 7
  bc_mask_channel_idx: 8
  constraint_bc_enforcement: 'off'
  constraint_bc_weight: 0.1
  constraint_bc_warmup_fraction: 0.0
  constraint_bc_eps: 1.0e-8
  constraint_bc_loss_norm: 'l2'

poisson: &poisson
  <<: *DEFAULT
  batch_size: 512
  valid_batch_size: 512
  nx: 128
  ny: 128
  log_to_wandb: !!bool True
  save_checkpoint: !!bool True
  max_epochs: 500
  scheduler: 'cosine'
  plot_figs: !!bool True
  loss_style: 'sum'
  system: 'poisson'
  model: 'fno'
  layers: [64, 64, 64, 64, 64]
  modes1: [65, 65, 65, 65]
  modes2: [65, 65, 65, 65]
  fc_dim: 128
  in_dim: 4
  out_dim: 1
  mode_cut: 16
  embed_cut: 64
  fc_cut: 2
  optimizer: 'adam'
  lr: 1E-3
  pack_data: !!bool False

poisson-k1_2.5-mixed-bc-base: &poisson_k1_2p5_mixed_bc_base
  <<: *poisson
  train_path:    'data/bc/poisson/_train_k1p0_2p5_32k_bc.h5'
  val_path:      'data/bc/poisson/_val_k1p0_2p5_4k_bc.h5'
  test_path:     'data/bc/poisson/_test_k1p0_2p5_4k_bc.h5'
  scales_path:   'data/bc/poisson/_train_k1p0_2p5_32k_bc_scales.npy'
  batch_size: 128
  valid_batch_size: 128
  log_to_wandb: !!bool True
  mode_cut: 32
  embed_cut: 64
  fc_cut: 2
  max_epochs: 500
  plot_figs: !!bool False
  checkpoint_interval_epochs: 50
  checkpoint_best_at_end: !!bool True
  in_dim: 9  # Poisson BC mixed format: 1 (source) + 6 (tensor) + 2 (bc) = 9
  constraint_diffusion_tensor_order: 'k11_k12_k22'

poisson-k1_2.5-mixed-bc-off-pretrained-base: &poisson_k1_2p5_mixed_bc_off_pretrained_base
  <<: *poisson_k1_2p5_mixed_bc_base
  scales_path:   'data/bc/mixed/_train_mixed_32k_bc_scales.npy'
  constraint_bc_enforcement: 'off'
  constraint_bc_weight: 0.0

# Mixed BC soft checkpoints keep the standard downstream forward map and do
# not reapply the soft BC loss during transfer.
poisson-k1_2.5-mixed-bc-soft-pretrained-base: &poisson_k1_2p5_mixed_bc_soft_pretrained_base
  <<: *poisson_k1_2p5_mixed_bc_base
  scales_path:   'data/bc/mixed/_train_mixed_32k_bc_scales.npy'
  constraint_bc_enforcement: 'off'
  constraint_bc_weight: 0.0

# Mixed BC hard checkpoints were pretrained with exact boundary projection in
# the forward map, so we keep that projection active during downstream transfer.
poisson-k1_2.5-mixed-bc-hard-pretrained-base: &poisson_k1_2p5_mixed_bc_hard_pretrained_base
  <<: *poisson_k1_2p5_mixed_bc_base
  scales_path:   'data/bc/mixed/_train_mixed_32k_bc_scales.npy'
  constraint_bc_enforcement: 'hard'
  constraint_bc_weight: 0.0

# Mixed BC hard+soft checkpoints keep the hard projection active downstream,
# while the soft BC regularizer remains pretraining-only for now.
poisson-k1_2.5-mixed-bc-hard-soft-pretrained-base: &poisson_k1_2p5_mixed_bc_hard_soft_pretrained_base
  <<: *poisson_k1_2p5_mixed_bc_base
  scales_path:   'data/bc/mixed/_train_mixed_32k_bc_scales.npy'
  constraint_bc_enforcement: 'hard'
  constraint_bc_weight: 0.0

