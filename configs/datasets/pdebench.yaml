# PDEBench Dataset Configuration
name: pdebench
task: diffusion-sorption  # Options: diffusion-sorption, advection, etc.

# Dataset paths
data_path: ${data_dir}/raw/pdebench

# Data splits
train_size: 0.7
val_size: 0.15
test_size: 0.15

# Data parameters
spatial_resolution: [64, 64]
temporal_resolution: 100
n_samples_train: 1000
n_samples_val: 200
n_samples_test: 200

# Data preprocessing
normalize: true
normalization_method: standard  # standard, minmax

# Data augmentation
augmentation:
  enabled: false
  flip_prob: 0.5
  rotate_prob: 0.3

# DataLoader settings
batch_size: 16
num_workers: 4
pin_memory: true
shuffle_train: true
