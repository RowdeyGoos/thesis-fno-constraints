# Base configuration for all experiments
defaults:
  - datasets: pdebench
  - models: fno_baseline
  - training: default
  - logging: tensorboard  # tensorboard, wandb, or null

# Random seed
seed: 42

# Device configuration
device: cuda
precision: 32  # 16, 32, or 64

# Paths
data_dir: ${oc.env:PWD}/data
checkpoint_dir: ${oc.env:PWD}/models/checkpoints
log_dir: ${oc.env:PWD}/experiments/logs

# Reproducibility
deterministic: true
benchmark: false
