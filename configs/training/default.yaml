# Default Training Configuration
name: default

# Training parameters
epochs: 100
gradient_accumulation_steps: 1
clip_grad_norm: 1.0

# Optimizer
optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8

# Learning rate scheduler
scheduler:
  name: cosine  # cosine, step, exponential, plateau
  warmup_epochs: 5
  min_lr: 1e-6
  
  # For step scheduler
  step_size: 30
  gamma: 0.1
  
  # For plateau scheduler
  patience: 10
  factor: 0.5

# Loss function
loss:
  name: mse  # mse, mae, huber, combined
  
  # For combined loss
  mse_weight: 1.0
  mae_weight: 0.0
  
  # For huber loss
  delta: 1.0

# Checkpointing
checkpoint:
  save_every: 10  # epochs
  save_best: true
  monitor: val_loss
  mode: min  # min or max

# Early stopping
early_stopping:
  enabled: true
  patience: 20
  min_delta: 1e-6
  monitor: val_loss
  mode: min

# Validation
val_every: 1  # epochs
log_every: 10  # steps

# Testing
test_at_end: true
